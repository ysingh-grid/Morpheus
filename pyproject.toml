[project]
name = "morpheus-v0-1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docling[ocrmac]>=2.124.0",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langsmith>=0.1.0",
    "mcp>=2.1.1",
    "openai>=3.7.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "temporalio>=1.32.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
